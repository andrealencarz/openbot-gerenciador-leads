<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Leads</title>
<style>
:root{
  --bg:#0f1117;--card:#171a23;--card2:#1e2230;--border:#2a2f3f;
  --text:#e8eaf0;--muted:#8b91a5;--accent:#4f7cff;--accent2:#22c55e;
  --danger:#ef4444;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.container{max-width:1200px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:1.5rem;font-weight:700}
h1 span{color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:none;border-radius:var(--radius);padding:10px 16px;cursor:pointer;font-weight:600;transition:filter .15s}
button:hover{filter:brightness(1.15)}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--card2);color:var(--text)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;min-width:120px}
.stat b{display:block;font-size:1.4rem;color:var(--accent)}
.stat small{color:var(--muted)}
.searchbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
input,select{font:inherit;background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;color:var(--text);outline:none;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
input[type=search]{flex:1;min-width:200px}
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:4px;width:fit-content;flex-wrap:wrap}
.tab{padding:8px 20px;border-radius:8px;cursor:pointer;color:#cfd4e2;background:var(--card2);font-weight:600}
.tab.active{background:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:.9rem;vertical-align:top}
th{background:var(--card2);color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(79,124,255,.05)}
td.actions{white-space:nowrap;text-align:right}
.actions button{padding:6px 12px;font-size:.8rem;border-radius:8px;margin-left:4px}
.tag{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:.78rem;margin:2px 3px 2px 0}
.tag.sem{border-color:var(--accent2);color:var(--accent2)}
select.status{padding:4px 8px;font-size:.8rem;border-radius:8px;max-width:150px}
.empty{padding:40px;text-align:center;color:var(--muted)}
dialog{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:16px;padding:24px;max-width:480px;width:92%}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-size:1.1rem;margin-bottom:16px}
label{display:block;font-size:.8rem;color:var(--muted);margin:12px 0 4px;font-weight:600}
dialog input,dialog textarea,dialog select{width:100%}
dialog textarea{resize:vertical;min-height:60px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#fff;padding:10px 20px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:5}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🚀 Gerenciador de <span>Leads</span></h1>
    <div class="toolbar">
      <button class="btn-ghost" id="btnExport">⬇️ Exportar JSON</button>
      <button class="btn-ghost" id="btnImport">⬆️ Importar</button>
      <button class="btn-primary" id="btnAdd">+ Adicionar</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="stLeads">0</b><small>Leads</small></div>
    <div class="stat"><b id="stSemSite">0</b><small>Sem site</small></div>
    <div class="stat"><b id="stPropostas">0</b><small>Propostas enviadas</small></div>
    <div class="stat"><b id="stReunioes">0</b><small>Reuniões marcadas</small></div>
    <div class="stat"><b id="stCidades">0</b><small>Cidades</small></div>
    <div class="stat"><b id="stCampanhas">0</b><small>Campanhas</small></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="leads">Leads</div>
    <div class="tab" data-tab="campanhas">Campanhas</div>
    <div class="tab" data-tab="cidades">Cidades & Bairros</div>
    <div class="tab" data-tab="nichos">Nichos</div>
  </div>

  <div class="searchbar">
    <input type="search" id="busca" placeholder="🔍 Buscar por nome, telefone, cidade, nicho…">
    <select id="filtroCidade" style="min-width:150px"><option value="">Cidade: todas</option></select>
    <select id="filtroUf" style="min-width:130px"><option value="">Estado: todos</option></select>
    <select id="filtroStatus" style="min-width:170px">
      <option value="">Todos os status</option>
    </select>
  </div>

  <div id="tabelaLeads"></div>
  <div id="tabelaCampanhas" style="display:none"></div>
  <div id="tabelaCidades" style="display:none"></div>
  <div id="tabelaNichos" style="display:none"></div>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle">Adicionar</h2>

  <div id="dlgLead" style="display:none">
    <label>Nome / Empresa *</label><input id="flNome" placeholder="Ex.: Odonto Sorriso">
    <label>Telefone</label><input id="flTel" placeholder="Ex.: (85) 99999-0000">
    <label>Email</label><input id="flEmail" placeholder="Ex.: contato@exemplo.com.br">
    <label>Cidade</label><input id="flCidade" placeholder="Ex.: Fortaleza" list="dlCidades"><datalist id="dlCidades"></datalist>
    <label>Nicho</label><input id="flNicho" placeholder="Ex.: Clínicas odontológicas" list="dlNichos"><datalist id="dlNichos"></datalist>
    <label>Site</label>
    <select id="flSite"><option value="sem site">Sem site</option><option value="com site">Com site</option><option value="desconhecido">Desconhecido</option></select>
    <label>Status</label>
    <select id="flStatus">
      <option value="novo">Novo</option>
      <option value="contato feito">Contato feito</option>
      <option value="proposta enviada">Proposta enviada</option>
      <option value="reuniao marcada">Reunião marcada</option>
      <option value="fechado">Fechado</option>
      <option value="perdido">Perdido</option>
    </select>
    <label>Observações</label><textarea id="flObs"></textarea>
  </div>

  <div id="dlgCampanha" style="display:none">
    <label>Nome da campanha *</label><input id="fcNome" placeholder="Ex.: Odontos sem site — Fortaleza">
    <label>Nicho</label><input id="fcNicho" placeholder="Ex.: Clínicas odontológicas">
    <label>Cidades (separadas por vírgula)</label><textarea id="fcCidades" placeholder="Ex.: Fortaleza, Teresina"></textarea>
    <label>Status</label>
    <select id="fcStatus">
      <option value="planejada">Planejada</option>
      <option value="ativa">Ativa</option>
      <option value="pausada">Pausada</option>
      <option value="concluida">Concluída</option>
    </select>
    <label>Observações</label><textarea id="fcObs"></textarea>
  </div>

  <div id="dlgCidade" style="display:none">
    <label>Cidade *</label><input id="fCidade" placeholder="Ex.: Fortaleza">
    <label>UF</label><input id="fUf" placeholder="Ex.: CE" maxlength="2" style="text-transform:uppercase">
    <label>Bairros (separados por vírgula)</label><textarea id="fBairros" placeholder="Ex.: Meireles, Aldeota, Papicu"></textarea>
    <label>Status</label>
    <select id="fStatus"><option value="nao iniciada">Não iniciada</option><option value="em andamento">Em andamento</option><option value="prospectada">Prospectada</option></select>
  </div>

  <div id="dlgNicho" style="display:none">
    <label>Nicho *</label><input id="fNome" placeholder="Ex.: Clínicas odontológicas">
    <label>Observações</label><textarea id="fObs" placeholder="Termos de busca, variações…"></textarea>
  </div>

  <div class="form-actions">
    <button class="btn-ghost" id="btnCancel">Cancelar</button>
    <button class="btn-primary" id="btnSave">Salvar</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json" style="display:none">

<script>
const SEED_CIDADES=[
 {cidade:"São Paulo",uf:"SP",bairros:["Moema","Jardins","Itaim Bibi","Pinheiros","Vila Mariana","Paulista"],status:"nao iniciada"},
 {cidade:"Rio de Janeiro",uf:"RJ",bairros:["Copacabana","Ipanema","Barra da Tijuca","Botafogo","Tijuca"],status:"nao iniciada"},
 {cidade:"Brasília",uf:"DF",bairros:["Asa Sul","Asa Norte","Águas Claras","Lago Sul"],status:"nao iniciada"},
 {cidade:"Fortaleza",uf:"CE",bairros:["Meireles","Aldeota","Papicu","Varjota"],status:"nao iniciada"},
 {cidade:"Salvador",uf:"BA",bairros:["Barra","Pituba","Itapuã","Patamares"],status:"nao iniciada"},
 {cidade:"Belo Horizonte",uf:"MG",bairros:["Savassi","Funcionários","Buritis","Santa Mônica"],status:"nao iniciada"},
 {cidade:"Manaus",uf:"AM",bairros:["Adrianópolis","Ponta Negra","Vieiralves"],status:"nao iniciada"},
 {cidade:"Curitiba",uf:"PR",bairros:["Batel","Água Verde","Bacacheri","Champagnat"],status:"nao iniciada"},
 {cidade:"Recife",uf:"PE",bairros:["Boa Viagem","Espinheiro","Pina"],status:"nao iniciada"},
 {cidade:"Goiânia",uf:"GO",bairros:["Setor Marista","Bueno","Jardim Goiás","Campinas"],status:"nao iniciada"},
 {cidade:"Belém",uf:"PA",bairros:["Nazaré","Batista Campos","Marco"],status:"nao iniciada"},
 {cidade:"Porto Alegre",uf:"RS",bairros:["Moinhos de Vento","Bela Vista","Ipanema"],status:"nao iniciada"},
 {cidade:"Campinas",uf:"SP",bairros:["Cambuí","Taquaral","Nova Campinas"],status:"nao iniciada"},
 {cidade:"Natal",uf:"RN",bairros:["Ponta Negra","Lagoa Nova","Capim Macio"],status:"nao iniciada"},
 {cidade:"Teresina",uf:"PI",bairros:["Centro","Jockey","Piçarra","Marilos"],status:"nao iniciada"},
 {cidade:"João Pessoa",uf:"PB",bairros:["Manaíra","Cabo Branco","Tambaú"],status:"nao iniciada"},
 {cidade:"Maceió",uf:"AL",bairros:["Ponta Verde","Jatiúca","Maceió Parque"],status:"nao iniciada"},
 {cidade:"Campo Grande",uf:"MS",bairros:["Amambaí","Carandá Bosque","Bairro Universitário"],status:"nao iniciada"},
 {cidade:"São Luís",uf:"MA",bairros:["Pontas Negras","Jardim Renascença","Calhau"],status:"nao iniciada"},
 {cidade:"Guarulhos",uf:"SP",bairros:["Centro","Jardim Zaira","Bom Clima"],status:"nao iniciada"}
];
const SEED_NICHOS=[
 {nome:"Clínicas odontológicas",obs:"Clínica odontológica, dentista, ortodontia"},
 {nome:"Restaurantes",obs:"Restaurante, pizzaria, hamburgueria"},
 {nome:"Academias",obs:"Academia, crossfit, pilates"},
 {nome:"Pet shops",obs:"Pet shop, clínica veterinária, banho e tosa"},
 {nome:"Clínicas estéticas",obs:"Clínica de estética, depilação, esteticista"}
];
const STATUS_LEADS=["novo","contato feito","proposta enviada","reuniao marcada","fechado","perdido"];
const STATUS_CAMP=["planejada","ativa","pausada","concluida"];
const STATUS_CIDADE=["nao iniciada","em andamento","prospectada"];

const KEY="gerenciador_leads_v2";
let storageOk=true;
let data={cidades:structuredClone(SEED_CIDADES),nichos:structuredClone(SEED_NICHOS),leads:[],campanhas:[]};
try{
  const saved=JSON.parse(localStorage.getItem(KEY)||"null");
  if(saved&&Array.isArray(saved.cidades))data=saved;
}catch(e){storageOk=false}
let saveTimer=null;
fetch("/api/state").then(r=>r.json()).then(j=>{
  if(j&&Array.isArray(j.cidades)&&j.cidades.length){data=j;render()}
}).catch(()=>{});
let tab="leads",editIdx=null;
const $=id=>document.getElementById(id);
function save(){
  if(storageOk){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){storageOk=false}}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
      .then(r=>r.json()).then(j=>{if(j&&Array.isArray(j.cidades)){data=j;stats()}}).catch(()=>{});
  },300);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function stats(){
  $("stLeads").textContent=data.leads.length;
  $("stSemSite").textContent=data.leads.filter(l=>l.site==="sem site").length;
  $("stPropostas").textContent=data.leads.filter(l=>l.status==="proposta enviada").length;
  $("stReunioes").textContent=data.leads.filter(l=>l.status==="reuniao marcada").length;
  $("stCidades").textContent=data.cidades.length;
  $("stCampanhas").textContent=data.campanhas.length;
}
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function optList(arr,v){return arr.map(s=>`<option ${v===s?"selected":""} value="${s}">${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join("")}
function filtroAtual(){
  const sel=$("filtroStatus");
  let opts=[];
  if(tab==="leads"){opts=new Set();(data.leads||[]).forEach(l=>opts.add(l.status||"novo"));STATUS_LEADS.forEach(s=>opts.add(s))}
  else if(tab==="campanhas"){opts=new Set();(data.campanhas||[]).forEach(c=>opts.add(c.status||"planejada"));STATUS_CAMP.forEach(s=>opts.add(s))}
  else if(tab==="cidades"){opts=new Set();STATUS_CIDADE.forEach(s=>opts.add(s))}
  else{sel.style.display="none";return ""}
  sel.style.display="";
  sel.innerHTML=`<option value="">Todos os status</option>`+[...opts].sort().map(s=>`<option ${sel.value===s?"selected":""} value="${s}">${esc(s)}</option>`).join("");
  return sel.value;
}
function filtrosCidadeUf(){
  const fc=$("filtroCidade"),fu=$("filtroUf");
  const cidades=new Set();const ufs=new Set();
  data.cidades.forEach(c=>{if(c.cidade)cidades.add(c.cidade);if(c.uf)ufs.add(c.uf)});
  data.leads.forEach(l=>{if(l.cidade)cidades.add(l.cidade)});
  const cv=fc.value,uv=fu.value;
  fc.innerHTML=`<option value="">Cidade: todas</option>`+[...cidades].sort().map(c=>`<option ${cv===c?"selected":""} value="${esc(c)}">${esc(c)}</option>`).join("");
  fu.innerHTML=`<option value="">Estado: todos</option>`+[...ufs].sort().map(u=>`<option ${uv===u?"selected":""} value="${esc(u)}">${esc(u)}</option>`).join("");
  const mostrar=(tab==="leads"||tab==="cidades");
  fc.style.display=mostrar?"":"none";
  fu.style.display=mostrar?"":"none";
  return {cidade:cv,uf:uv};
}
function ufDe(cidade){
  const c=data.cidades.find(x=>norm(x.cidade)===norm(cidade||""));
  return c?(c.uf||""):"";
}
const PAGESIZE=25;
let pagina={leads:1,campanhas:1,cidades:1,nichos:1};
function paginar(lista){
  const total=lista.length;
  const pags=Math.max(1,Math.ceil(total/PAGESIZE));
  const p=Math.min(pagina[tab],pags);
  pagina[tab]=p;
  const fatia=lista.slice((p-1)*PAGESIZE,p*PAGESIZE);
  let ctrl="";
  if(pags>1||total>PAGESIZE){
    ctrl=`<div style="display:flex;gap:10px;align-items:center;justify-content:center;padding:12px">
    <button class="btn-ghost" ${p<=1?"disabled":""} onclick="mudarPag(-1)">‹ Anterior</button>
    <small style="color:var(--muted)">Página ${p} de ${pags} · ${total} registro${total===1?"":"s"}</small>
    <button class="btn-ghost" ${p>=pags?"disabled":""} onclick="mudarPag(1)">Próxima ›</button></div>`;
  }
  return {fatia,ctrl};
}
window.mudarPag=d=>{pagina[tab]=Math.max(1,(pagina[tab]||1)+d);render();$("tabela"+tab.charAt(0).toUpperCase()+tab.slice(1)).scrollIntoView({block:"start"})};
function render(){
  stats();
  $("dlCidades").innerHTML=data.cidades.map(c=>`<option value="${esc(c.cidade)}">`).join("");
  $("dlNichos").innerHTML=data.nichos.map(n=>`<option value="${esc(n.nome)}">`).join("");
  const q=norm($("busca").value.trim());
  const fs=filtroAtual();
  const {cidade:fCid,uf:fUf}=filtrosCidadeUf();

  let lsRows=data.leads.map((l,i)=>{
    const hay=norm([l.nome,l.telefone,l.email,l.cidade,l.nicho,l.status,l.obs].join(" "));
    if(!hay.includes(q))return "";
    if(fs&&l.status!==fs)return "";
    if(fCid&&norm(l.cidade||"")!==norm(fCid))return "";
    if(fUf&&norm(ufDe(l.cidade))!==norm(fUf))return "";
    const siteTag=l.site==="sem site"?`<span class="tag sem">sem site</span>`:l.site==="com site"?`<span class="tag">com site</span>`:`<span class="tag">?</span>`;
    return `<tr><td><b>${esc(l.nome)}</b><br><small style="color:var(--muted)">${esc(l.telefone||"")}${l.telefone&&l.email?" · ":""}${esc(l.email||"")}</small></td>
    <td>${esc(l.cidade||"—")}<br><small style="color:var(--muted)">${esc(l.nicho||"")}</small></td>
    <td>${siteTag}</td>
    <td><select class="status" onchange="chStatus('leads',${i},this.value)">${optList(STATUS_LEADS,l.status)}</select></td>
    <td>${esc(l.obs||"")}</td>
    <td class="actions"><button class="btn-ghost" onclick="edit('leads',${i})">✏️ Editar</button><button class="btn-danger" onclick="del('leads',${i})">🗑️</button></td></tr>`;
  }).filter(Boolean);
  const lPag=paginar(lsRows);
  $("tabelaLeads").innerHTML=(lPag.fatia.length?`<table><thead><tr><th>Lead</th><th>Cidade / Nicho</th><th>Site</th><th>Status</th><th>Obs.</th><th></th></tr></thead><tbody>${lPag.fatia.join("")}</tbody></table>`:`<div class="empty">Nenhum lead — clique em <b>+ Adicionar</b> para cadastrar o primeiro.</div>`)+lPag.ctrl;

  const cmsRows=data.campanhas.map((x,i)=>{
    const hay=norm([x.nome,x.nicho,(x.cidades||[]).join(" "),x.status,x.obs].join(" "));
    if(!hay.includes(q))return "";
    if(fs&&x.status!==fs)return "";
    return `<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.nicho||"—")}</td><td>${(x.cidades||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join("")||"—"}</td>
    <td><select class="status" onchange="chStatus('campanhas',${i},this.value)">${optList(STATUS_CAMP,x.status)}</select></td>
    <td>${esc(x.obs||"")}</td>
    <td class="actions"><button class="btn-ghost" onclick="edit('campanhas',${i})">✏️ Editar</button><button class="btn-danger" onclick="del('campanhas',${i})">🗑️</button></td></tr>`;
  }).filter(Boolean);
  const cPag=paginar(cmsRows);
  $("tabelaCampanhas").innerHTML=(cPag.fatia.length?`<table><thead><tr><th>Campanha</th><th>Nicho</th><th>Cidades</th><th>Status</th><th>Obs.</th><th></th></tr></thead><tbody>${cPag.fatia.join("")}</tbody></table>`:`<div class="empty">Nenhuma campanha ainda.</div>`)+cPag.ctrl;

  const csRows=data.cidades.map((c,i)=>{
    const hay=norm(c.cidade+" "+c.uf+" "+c.bairros.join(" "));
    if(!hay.includes(q))return "";
    if(fs&&c.status!==fs)return "";
    if(fCid&&norm(c.cidade)!==norm(fCid))return "";
    if(fUf&&norm(c.uf)!==norm(fUf))return "";
    const bs=c.bairros.length?c.bairros.map(b=>`<span class="tag">${esc(b)}</span>`).join(""):`<span style="color:var(--muted)">—</span>`;
    return `<tr><td><b>${esc(c.cidade)}</b></td><td>${esc(c.uf)}</td><td>${bs}</td>
    <td><select class="status" onchange="chStatus('cidades',${i},this.value)">${optList(STATUS_CIDADE,c.status)}</select></td>
    <td class="actions"><button class="btn-ghost" onclick="edit('cidades',${i})">✏️ Editar</button><button class="btn-danger" onclick="del('cidades',${i})">🗑️</button></td></tr>`;
  }).filter(Boolean);
  const cidPag=paginar(csRows);
  $("tabelaCidades").innerHTML=(cidPag.fatia.length?`<table><thead><tr><th>Cidade</th><th>UF</th><th>Bairros</th><th>Status</th><th></th></tr></thead><tbody>${cidPag.fatia.join("")}</tbody></table>`:`<div class="empty">Nenhuma cidade encontrada.</div>`)+cidPag.ctrl;

  const nsRows=data.nichos.map((n,i)=>{
    const hay=norm(n.nome+" "+(n.obs||""));
    if(!hay.includes(q))return "";
    return `<tr><td><b>${esc(n.nome)}</b></td><td>${esc(n.obs||"—")}</td>
    <td class="actions"><button class="btn-ghost" onclick="edit('nichos',${i})">✏️ Editar</button><button class="btn-danger" onclick="del('nichos',${i})">🗑️</button></td></tr>`;
  }).filter(Boolean);
  const nPag=paginar(nsRows);
  $("tabelaNichos").innerHTML=(nPag.fatia.length?`<table><thead><tr><th>Nicho</th><th>Observações</th><th></th></tr></thead><tbody>${nPag.fatia.join("")}</tbody></table>`:`<div class="empty">Nenhum nicho encontrado.</div>`)+nPag.ctrl;
}
window.chStatus=(tab,i,v)=>{data[tab][i].status=v;save();stats();toast("Status atualizado")};
const CAMPOS={
  leads:["flNome","flTel","flEmail","flCidade","flNicho","flSite","flStatus","flObs"],
  campanhas:["fcNome","fcNicho","fcCidades","fcStatus","fcObs"],
  cidades:["fCidade","fUf","fBairros","fStatus"],
  nichos:["fNome","fObs"]
};
const PANES={leads:"dlgLead",campanhas:"dlgCampanha",cidades:"dlgCidade",nichos:"dlgNicho"};
window.edit=(tab,i)=>{editIdx={tab,i};const o=data[tab][i];abrir(tab,"Editar",o)};
window.del=(tab,i)=>{
  const nome=data[tab][i].nome||data[tab][i].cidade||"";
  if(confirm(`Excluir "${nome}"?`)){data[tab].splice(i,1);save();render();toast("Excluído")}
};
function abrir(kind,title,o){
  editIdx=kind===tab?editIdx:null;
  $("dlgTitle").textContent=title+" "+({leads:"lead",campanhas:"campanha",cidades:"cidade",nichos:"nicho"}[kind]);
  Object.entries(PANES).forEach(([k,id])=>$(id).style.display=k===kind?"block":"none");
  const get=id=>{const el=$(id);return el?el.value:""};
  const set=(id,v)=>{const el=$(id);if(el)el.value=v||""};
  if(kind==="leads"){set("flNome",o.nome);set("flTel",o.telefone);set("flEmail",o.email);set("flCidade",o.cidade);set("flNicho",o.nicho);set("flSite",o.site||"sem site");set("flStatus",o.status||"novo");set("flObs",o.obs)}
  if(kind==="campanhas"){set("fcNome",o.nome);set("fcNicho",o.nicho);set("fcCidades",(o.cidades||[]).join(", "));set("fcStatus",o.status||"planejada");set("fcObs",o.obs)}
  if(kind==="cidades"){set("fCidade",o.cidade);set("fUf",o.uf);set("fBairros",(o.bairros||[]).join(", "));set("fStatus",o.status||"nao iniciada")}
  if(kind==="nichos"){set("fNome",o.nome);set("fObs",o.obs)}
  $("dlg").dataset.kind=kind;
  $("dlg").showModal();
}
$("btnAdd").onclick=()=>{editIdx=null;abrir(tab,"Adicionar",{})};
$("btnCancel").onclick=()=>$("dlg").close();
$("btnSave").onclick=()=>{
  const kind=$("dlg").dataset.kind;
  let obj;
  if(kind==="leads"){
    const nome=$("flNome").value.trim();if(!nome)return toast("Informe o nome");
    obj={nome,telefone:$("flTel").value.trim(),email:$("flEmail").value.trim(),cidade:$("flCidade").value.trim(),nicho:$("flNicho").value.trim(),site:$("flSite").value,status:$("flStatus").value,obs:$("flObs").value.trim()};
  }else if(kind==="campanhas"){
    const nome=$("fcNome").value.trim();if(!nome)return toast("Informe o nome da campanha");
    obj={nome,nicho:$("fcNicho").value.trim(),cidades:$("fcCidades").value.split(",").map(s=>s.trim()).filter(Boolean),status:$("fcStatus").value,obs:$("fcObs").value.trim()};
  }else if(kind==="cidades"){
    const nome=$("fCidade").value.trim();if(!nome)return toast("Informe a cidade");
    obj={cidade:nome,uf:$("fUf").value.trim().toUpperCase(),bairros:$("fBairros").value.split(",").map(s=>s.trim()).filter(Boolean),status:$("fStatus").value};
  }else{
    const nome=$("fNome").value.trim();if(!nome)return toast("Informe o nicho");
    obj={nome,obs:$("fObs").value.trim()};
  }
  if(editIdx&&editIdx.tab===kind){data[kind][editIdx.i]=obj}else{data[kind].push(obj)}
  save();$("dlg").close();render();toast("Salvo ✓");
};
$("busca").oninput=()=>{pagina[tab]=1;render()};
$("filtroStatus").onchange=()=>{pagina[tab]=1;render()};
$("filtroCidade").onchange=()=>{pagina[tab]=1;render()};
$("filtroUf").onchange=()=>{pagina[tab]=1;render()};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");tab=t.dataset.tab;
  ["tabelaLeads","tabelaCampanhas","tabelaCidades","tabelaNichos"].forEach(id=>$(id).style.display="none");
  $("tabela"+tab.charAt(0).toUpperCase()+tab.slice(1)).style.display="block";
  pagina[tab]=1;
  render();
});
$("btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gerenciador_leads.json";a.click();
};
$("btnImport").onclick=()=>$("fileImport").click();
$("fileImport").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    ["cidades","nichos","leads","campanhas"].forEach(k=>{if(Array.isArray(j[k]))data[k]=j[k]});
    save();render();toast("Importado ✓")
  }catch{toast("JSON inválido")}};
  r.readAsText(f);
};
render();
</script>
</body>
</html>
