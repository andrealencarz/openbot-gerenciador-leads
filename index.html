<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Leads</title>
<style>
:root{
  --gz-bg:#0b0d13;--gz-card:#141824;--gz-card2:#1b2030;--gz-border:#262c3f;
  --gz-text:#e9ecf4;--gz-muted:#8f96ab;--gz-accent:#5b7cfa;--gz-accent-soft:rgba(91,124,250,.14);
  --gz-green:#34d399;--gz-amber:#fbbf24;--gz-red:#f87171;--radius:14px;--radius-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 500px at 80% -10%,rgba(91,124,250,.08),transparent),var(--gz-bg);color:var(--gz-text);min-height:100vh;padding:20px 16px 48px}
.wrap{max-width:1160px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gz-accent),#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.brand h1{font-size:1.15rem;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:.75rem;color:var(--gz-muted);font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;border:none;border-radius:var(--radius-sm);padding:9px 15px;cursor:pointer;font-weight:600;font-size:.85rem;transition:filter .15s,transform .05s}
button:active{transform:scale(.97)}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.4;cursor:default}
.btn-primary{background:var(--gz-accent);color:#fff}
.btn-ghost{background:var(--gz-card2);color:var(--gz-text);border:1px solid var(--gz-border)}
.btn-danger{background:transparent;color:var(--gz-red);border:1px solid transparent;padding:6px 9px}
.btn-edit{background:transparent;color:var(--gz-muted);border:1px solid transparent;padding:6px 9px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--gz-card);border:1px solid var(--gz-border);border-radius:var(--radius);padding:14px 16px}
.stat b{display:block;font-size:1.35rem;color:var(--gz-text);letter-spacing:-.02em}
.stat small{color:var(--gz-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat.hi b{color:var(--gz-accent)}
.tabs{display:flex;gap:6px;background:var(--gz-card);border:1px solid var(--gz-border);border-radius:var(--radius);padding:5px;width:fit-content;max-width:100%;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;border-radius:10px;cursor:pointer;color:var(--gz-muted);font-weight:600;font-size:.85rem;background:transparent;white-space:nowrap}
.tab.active{background:var(--gz-accent);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;background:var(--gz-card2);border:1px solid var(--gz-border);border-radius:var(--radius-sm);padding:9px 13px;color:var(--gz-text);outline:none;font-size:.88rem;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--gz-accent);box-shadow:0 0 0 3px var(--gz-accent-soft)}
input[type=search]{flex:1;min-width:180px}
select{max-width:100%}
.panel{background:var(--gz-card);border:1px solid var(--gz-border);border-radius:var(--radius);overflow:hidden}
.panel{background:var(--gz-card);border:1px solid var(--gz-border);border-radius:var(--gz-radius);overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--gz-border)}
.row:last-of-type{border-bottom:none}
.row:hover{background:rgba(91,124,250,.045)}
.row-main{flex:1;min-width:0}
.b{font-weight:600}
.sub{display:block;color:var(--gz-muted);font-size:.76rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;max-width:42%}
.row-side{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.tag{display:inline-block;background:var(--gz-card2);border:1px solid var(--gz-border);border-radius:999px;padding:3px 10px;font-size:.74rem}
.tag.sem{border-color:rgba(52,211,153,.4);color:var(--gz-green);background:rgba(52,211,153,.08)}
.tag.com{border-color:rgba(251,191,36,.35);color:var(--gz-amber);background:rgba(251,191,36,.07)}
select.status{padding:5px 9px;font-size:.78rem;border-radius:8px;font-weight:600;max-width:150px}
select.status{padding:5px 9px;font-size:.78rem;border-radius:8px;font-weight:600;max-width:150px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;padding:13px;flex-wrap:wrap;border-top:1px solid var(--gz-border)}
.pager small{color:var(--gz-muted);font-size:.8rem}
.empty{padding:48px 20px;text-align:center;color:var(--gz-muted)}
.empty .ico{font-size:1.8rem;display:block;margin-bottom:8px}
dialog{background:var(--gz-card);color:var(--gz-text);border:1px solid var(--gz-border);border-radius:var(--radius);padding:22px;max-width:460px;width:min(92vw,460px)}
dialog::backdrop{background:rgba(5,7,12,.7);backdrop-filter:blur(2px)}
dialog h2{font-size:1.02rem;margin-bottom:4px}
label{display:block;font-size:.72rem;color:var(--gz-muted);margin:12px 0 4px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
dialog input,dialog textarea,dialog select{width:100%}
dialog textarea{resize:vertical;min-height:56px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--gz-green);color:#06281c;padding:10px 20px;border-radius:10px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;font-size:.85rem;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;padding:14px}
.dash .stat{padding:13px 15px}
.dash-box{border-top:1px solid var(--gz-border);padding:16px 16px 18px}
.dash-title{color:var(--gz-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:12px}
.bar-row{display:grid;grid-template-columns:170px 1fr 40px;gap:10px;align-items:center;margin:7px 0}
.bar{background:var(--gz-card2);border-radius:999px;height:9px;overflow:hidden}
.bar-fill{background:linear-gradient(90deg,var(--gz-accent),#8b5cf6);height:100%;border-radius:999px;transition:width .3s}
.bar-val{text-align:right;font-size:.8rem;color:var(--gz-text);font-weight:600}
.bar-label{font-size:.8rem;color:var(--gz-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== mobile ===== */
@media (max-width:720px){
  body{padding:14px 10px 40px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .bar-row{grid-template-columns:105px 1fr 34px}
  .tab{padding:8px 14px}
  .row{flex-wrap:wrap;gap:8px}
  .row-meta{order:3;width:100%;max-width:none;padding-left:2px}
  .row-side{width:100%;justify-content:flex-start;margin-left:0}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🚀</div>
      <div><h1>Gerenciador de Leads</h1><small>Prospecção · cidades, nichos e campanhas</small></div>
    </div>
    <div class="actions">
      <button class="btn-ghost" id="btnExport">⬇️ Exportar</button>
      <button class="btn-ghost" id="btnImport">⬆️ Importar</button>
      <button class="btn-primary" id="btnAdd">+ Adicionar</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="dashboard">Dashboard</div>
    <div class="tab" data-tab="leads">Leads</div>
    <div class="tab" data-tab="campanhas">Campanhas</div>
    <div class="tab" data-tab="cidades">Cidades</div>
    <div class="tab" data-tab="nichos">Nichos</div>
  </div>

  <div class="filters">
    <input type="search" id="busca" placeholder="🔍 Buscar por nome, telefone, cidade, nicho…">
    <select id="filtroCidade" style="min-width:140px"><option value="">Cidade: todas</option></select>
    <select id="filtroUf" style="min-width:120px"><option value="">Estado: todos</option></select>
    <select id="filtroStatus" style="min-width:160px"><option value="">Status: todos</option></select>
  </div>

  <div class="panel">
    <div id="tabelaDashboard"></div>
    <div id="tabelaLeads" style="display:none"></div>
    <div id="tabelaCampanhas" style="display:none"></div>
    <div id="tabelaCidades" style="display:none"></div>
    <div id="tabelaNichos" style="display:none"></div>
  </div>
</div>

<dialog id="dlg">
  <h2 id="dlgTitle">Adicionar</h2>

  <div id="dlgLead" style="display:none">
    <label>Nome / Empresa *</label><input id="flNome" placeholder="Ex.: Odonto Sorriso">
    <div class="grid2">
      <div><label>Telefone</label><input id="flTel" placeholder="(85) 99999-0000"></div>
      <div><label>Email</label><input id="flEmail" placeholder="contato@exemplo.com.br"></div>
    </div>
    <div class="grid2">
      <div><label>Cidade</label><input id="flCidade" placeholder="Fortaleza" list="dlCidades"><datalist id="dlCidades"></datalist></div>
      <div><label>Nicho</label><input id="flNicho" placeholder="Clínicas odontológicas" list="dlNichos"><datalist id="dlNichos"></datalist></div>
    </div>
    <div class="grid2">
      <div><label>Site</label><select id="flSite"><option value="sem site">Sem site</option><option value="com site">Com site</option><option value="desconhecido">Desconhecido</option></select></div>
      <div><label>Status</label><select id="flStatus">
        <option value="novo">Novo</option><option value="contato feito">Contato feito</option>
        <option value="proposta enviada">Proposta enviada</option><option value="reuniao marcada">Reunião marcada</option>
        <option value="fechado">Fechado</option><option value="perdido">Perdido</option>
      </select></div>
    </div>
    <label>Observações</label><textarea id="flObs"></textarea>
  </div>

  <div id="dlgCampanha" style="display:none">
    <label>Nome da campanha *</label><input id="fcNome" placeholder="Ex.: Odontos sem site — Fortaleza">
    <div class="grid2">
      <div><label>Nicho</label><select id="fcNicho"></select></div>
      <div><label>Estado (filtra cidades)</label><select id="fcUfFiltro"></select></div>
    </div>
    <label>Cidades-alvo (Ctrl/Cmd + clique para várias)</label>
    <select id="fcCidades" multiple size="6" style="width:100%"></select>
    <div style="margin-top:6px"><button type="button" class="btn-ghost" id="fcCidTodas" style="padding:5px 10px;font-size:.78rem">Marcar todas</button></div>
    <label>Status</label>
    <select id="fcStatus">
      <option value="planejada">Planejada</option><option value="ativa">Ativa</option>
      <option value="pausada">Pausada</option><option value="concluida">Concluída</option>
    </select>
    <label>Observações</label><textarea id="fcObs"></textarea>
  </div>

  <div id="dlgCidade" style="display:none">
    <div class="grid2">
      <div><label>Cidade *</label><input id="fCidade" placeholder="Fortaleza"></div>
      <div><label>UF</label><input id="fUf" placeholder="CE" maxlength="2" style="text-transform:uppercase"></div>
    </div>
    <label>Bairros (separados por vírgula)</label><textarea id="fBairros" placeholder="Meireles, Aldeota, Papicu"></textarea>
    <label>Status</label>
    <select id="fStatus"><option value="nao iniciada">Não iniciada</option><option value="em andamento">Em andamento</option><option value="prospectada">Prospectada</option></select>
  </div>

  <div id="dlgNicho" style="display:none">
    <label>Nicho *</label><input id="fNome" placeholder="Clínicas odontológicas">
    <label>Observações</label><textarea id="fObs" placeholder="Termos de busca, variações…"></textarea>
  </div>

  <div class="form-actions">
    <button class="btn-ghost" id="btnCancel">Cancelar</button>
    <button class="btn-primary" id="btnSave">Salvar</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json" style="display:none">

<script>
const SEED_CIDADES=[
 {cidade:"São Paulo",uf:"SP",bairros:["Moema","Jardins","Itaim Bibi","Pinheiros","Vila Mariana","Paulista"],status:"nao iniciada"},
 {cidade:"Rio de Janeiro",uf:"RJ",bairros:["Copacabana","Ipanema","Barra da Tijuca","Botafogo","Tijuca"],status:"nao iniciada"},
 {cidade:"Brasília",uf:"DF",bairros:["Asa Sul","Asa Norte","Águas Claras","Lago Sul"],status:"nao iniciada"},
 {cidade:"Fortaleza",uf:"CE",bairros:["Meireles","Aldeota","Papicu","Varjota"],status:"nao iniciada"},
 {cidade:"Salvador",uf:"BA",bairros:["Barra","Pituba","Itapuã","Patamares"],status:"nao iniciada"},
 {cidade:"Belo Horizonte",uf:"MG",bairros:["Savassi","Funcionários","Buritis","Santa Mônica"],status:"nao iniciada"},
 {cidade:"Manaus",uf:"AM",bairros:["Adrianópolis","Ponta Negra","Vieiralves"],status:"nao iniciada"},
 {cidade:"Curitiba",uf:"PR",bairros:["Batel","Água Verde","Bacacheri","Champagnat"],status:"nao iniciada"},
 {cidade:"Recife",uf:"PE",bairros:["Boa Viagem","Espinheiro","Pina"],status:"nao iniciada"},
 {cidade:"Goiânia",uf:"GO",bairros:["Setor Marista","Bueno","Jardim Goiás","Campinas"],status:"nao iniciada"},
 {cidade:"Belém",uf:"PA",bairros:["Nazaré","Batista Campos","Marco"],status:"nao iniciada"},
 {cidade:"Porto Alegre",uf:"RS",bairros:["Moinhos de Vento","Bela Vista","Ipanema"],status:"nao iniciada"},
 {cidade:"Campinas",uf:"SP",bairros:["Cambuí","Taquaral","Nova Campinas"],status:"nao iniciada"},
 {cidade:"Natal",uf:"RN",bairros:["Ponta Negra","Lagoa Nova","Capim Macio"],status:"nao iniciada"},
 {cidade:"Teresina",uf:"PI",bairros:["Centro","Jockey","Piçarra","Marilos"],status:"nao iniciada"},
 {cidade:"João Pessoa",uf:"PB",bairros:["Manaíra","Cabo Branco","Tambaú"],status:"nao iniciada"},
 {cidade:"Maceió",uf:"AL",bairros:["Ponta Verde","Jatiúca","Maceió Parque"],status:"nao iniciada"},
 {cidade:"Campo Grande",uf:"MS",bairros:["Amambaí","Carandá Bosque","Bairro Universitário"],status:"nao iniciada"},
 {cidade:"São Luís",uf:"MA",bairros:["Pontas Negras","Jardim Renascença","Calhau"],status:"nao iniciada"},
 {cidade:"Guarulhos",uf:"SP",bairros:["Centro","Jardim Zaira","Bom Clima"],status:"nao iniciada"}
];
const SEED_NICHOS=[
 {nome:"Clínicas odontológicas",obs:"Clínica odontológica, dentista, ortodontia"},
 {nome:"Restaurantes",obs:"Restaurante, pizzaria, hamburgueria"},
 {nome:"Academias",obs:"Academia, crossfit, pilates"},
 {nome:"Pet shops",obs:"Pet shop, clínica veterinária, banho e tosa"},
 {nome:"Clínicas estéticas",obs:"Clínica de estética, depilação, esteticista"}
];
const STATUS_LEADS=["novo","contato feito","proposta enviada","reuniao marcada","fechado","perdido"];
const STATUS_CAMP=["planejada","ativa","pausada","concluida"];
const STATUS_CIDADE=["nao iniciada","em andamento","prospectada"];

const KEY="gerenciador_leads_v2";
let storageOk=true;
let data={cidades:structuredClone(SEED_CIDADES),nichos:structuredClone(SEED_NICHOS),leads:[],campanhas:[]};
try{
  const saved=JSON.parse(localStorage.getItem(KEY)||"null");
  if(saved&&Array.isArray(saved.cidades))data=saved;
}catch(e){storageOk=false}
let saveTimer=null;
fetch("/api/state").then(r=>r.json()).then(j=>{
  if(j&&Array.isArray(j.cidades)&&j.cidades.length){data=j;render()}
}).catch(()=>{});
let tab="dashboard",editIdx=null;
const $=id=>document.getElementById(id);
function save(){
  if(storageOk){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){storageOk=false}}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
      .then(r=>r.json()).then(j=>{if(j&&Array.isArray(j.cidades)){data=j;stats()}}).catch(()=>{});
  },300);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2000)}
function stats(){
  const nLeads=data.leads.length;
  const semSite=data.leads.filter(l=>l.site==="sem site").length;
  const propostas=data.leads.filter(l=>l.status==="proposta enviada").length;
  const reunioes=data.leads.filter(l=>l.status==="reuniao marcada").length;
  const contatos=data.leads.filter(l=>l.status==="contato feito").length;
  const fechados=data.leads.filter(l=>l.status==="fechado").length;
  const perdidos=data.leads.filter(l=>l.status==="perdido").length;
  const campAtivas=data.campanhas.filter(c=>c.status==="ativa").length;
  $("tabelaDashboard").innerHTML=`
  <div class="dash">
    <div class="stat hi"><b>${nLeads}</b><small>Leads</small></div>
    <div class="stat"><b>${semSite}</b><small>Sem site</small></div>
    <div class="stat"><b>${contatos}</b><small>Contatos feitos</small></div>
    <div class="stat"><b>${propostas}</b><small>Propostas enviadas</small></div>
    <div class="stat"><b>${reunioes}</b><small>Reuniões marcadas</small></div>
    <div class="stat"><b>${fechados}</b><small>Fechados</small></div>
    <div class="stat"><b>${perdidos}</b><small>Perdidos</small></div>
    <div class="stat"><b>${campAtivas}/${data.campanhas.length}</b><small>Campanhas ativas</small></div>
    <div class="stat"><b>${data.cidades.length}</b><small>Cidades</small></div>
    <div class="stat"><b>${data.nichos.length}</b><small>Nichos</small></div>
  </div>
  ${barras("Leads por status", STATUS_LEADS, s=>data.leads.filter(l=>l.status===s).length, nLeads)}
  ${barras("Leads por nicho", data.nichos.map(n=>n.nome), s=>data.leads.filter(l=>l.nicho===s).length, nLeads, true)}
  ${barras("Leads por cidade", [...new Set(data.leads.map(l=>l.cidade).filter(Boolean))].sort(), s=>data.leads.filter(l=>l.cidade===s).length, nLeads, true)}`;
}
function barras(titulo,itens,conta,total,compact){
  if(!itens.length)return "";
  const rows=itens.map(s=>{
    const n=conta(s);
    const pct=total?Math.round(n/total*100):0;
    return `<div class="bar-row"><span class="bar-label">${esc(s)}</span><div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div><span class="bar-val">${n}</span></div>`;
  }).join("");
  return `<div class="dash-box"><div class="dash-title">${esc(titulo)}</div>${rows}</div>`;
}
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function optList(arr,v){return arr.map(s=>`<option ${v===s?"selected":""} value="${s}">${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join("")}
function tagSite(v){
  if(v==="sem site")return `<span class="tag sem">sem site</span>`;
  if(v==="com site")return `<span class="tag com">com site</span>`;
  return `<span class="tag">?</span>`;
}
function filtroAtual(){
  const sel=$("filtroStatus");
  let opts=[];
  if(tab==="leads"){opts=new Set();(data.leads||[]).forEach(l=>opts.add(l.status||"novo"));STATUS_LEADS.forEach(s=>opts.add(s))}
  else if(tab==="campanhas"){opts=new Set();(data.campanhas||[]).forEach(c=>opts.add(c.status||"planejada"));STATUS_CAMP.forEach(s=>opts.add(s))}
  else if(tab==="cidades"){opts=new Set();STATUS_CIDADE.forEach(s=>opts.add(s))}
  else{sel.style.display="none";return ""}
  sel.style.display="";
  sel.innerHTML=`<option value="">Status: todos</option>`+[...opts].sort().map(s=>`<option ${sel.value===s?"selected":""} value="${s}">${esc(s)}</option>`).join("");
  return sel.value;
}
function filtrosCidadeUf(){
  const fc=$("filtroCidade"),fu=$("filtroUf");
  const cidades=new Set();const ufs=new Set();
  data.cidades.forEach(c=>{if(c.cidade)cidades.add(c.cidade);if(c.uf)ufs.add(c.uf)});
  data.leads.forEach(l=>{if(l.cidade)cidades.add(l.cidade)});
  const cv=fc.value,uv=fu.value;
  fc.innerHTML=`<option value="">Cidade: todas</option>`+[...cidades].sort().map(c=>`<option ${cv===c?"selected":""} value="${esc(c)}">${esc(c)}</option>`).join("");
  fu.innerHTML=`<option value="">Estado: todos</option>`+[...ufs].sort().map(u=>`<option ${uv===u?"selected":""} value="${esc(u)}">${esc(u)}</option>`).join("");
  const mostrar=(tab==="leads"||tab==="cidades");
  fc.style.display=mostrar?"":"none";
  fu.style.display=mostrar?"":"none";
  return {cidade:cv,uf:uv};
}
function ufDe(cidade){
  const c=data.cidades.find(x=>norm(x.cidade)===norm(cidade||""));
  return c?(c.uf||""):"";
}
function atualizarCidCampanha(alvo){
  const uf=$("fcUfFiltro").value;
  const cidades=data.cidades.filter(c=>!uf||c.uf===uf);
  const escolhidas=new Set((alvo||[...$("fcCidades").selectedOptions].map(o=>o.value)));
  $("fcCidades").innerHTML=cidades.map(c=>`<option value="${esc(c.cidade)}" ${escolhidas.has(c.cidade)?"selected":""}>${esc(c.cidade)}${c.uf?" — "+esc(c.uf):""}</option>`).join("");
}
$("fcUfFiltro").onchange=()=>atualizarCidCampanha();
$("fcCidTodas").onclick=()=>{[...$("fcCidades").options].forEach(op=>op.selected=true)};
const PAGESIZE=25;
let pagina={leads:1,campanhas:1,cidades:1,nichos:1};
function paginar(lista){
  const total=lista.length;
  const pags=Math.max(1,Math.ceil(total/PAGESIZE));
  const p=Math.min(pagina[tab],pags);
  pagina[tab]=p;
  const fatia=lista.slice((p-1)*PAGESIZE,p*PAGESIZE);
  let ctrl="";
  if(total>PAGESIZE){
    ctrl=`<div class="pager">
    <button class="btn-ghost" ${p<=1?"disabled":""} onclick="mudarPag(-1)">‹ Anterior</button>
    <small>Página ${p} de ${pags} · ${total} registro${total===1?"":"s"}</small>
    <button class="btn-ghost" ${p>=pags?"disabled":""} onclick="mudarPag(1)">Próxima ›</button></div>`;
  }
  return {fatia,ctrl};
}
window.mudarPag=d=>{pagina[tab]=Math.max(1,(pagina[tab]||1)+d);render()};
function render(){
  $("btnAdd").style.display=tab==="dashboard"?"none":"";
  $("busca").style.display=tab==="dashboard"?"none":"";
  stats();
  $("dlCidades").innerHTML=data.cidades.map(c=>`<option value="${esc(c.cidade)}">`).join("");
  $("dlNichos").innerHTML=data.nichos.map(n=>`<option value="${esc(n.nome)}">`).join("");
  const q=norm($("busca").value.trim());
  const fs=filtroAtual();
  const {cidade:fCid,uf:fUf}=filtrosCidadeUf();

  let lsRows=data.leads.map((l,i)=>{
    const hay=norm([l.nome,l.telefone,l.email,l.cidade,l.nicho,l.status,l.obs].join(" "));
    if(!hay.includes(q))return "";
    if(fs&&l.status!==fs)return "";
    if(fCid&&norm(l.cidade||"")!==norm(fCid))return "";
    if(fUf&&norm(ufDe(l.cidade))!==norm(fUf))return "";
    return `<div class="row">
    <div class="row-main"><span class="b">${esc(l.nome)}</span><span class="sub">${esc(l.telefone||"")}${l.telefone&&l.email?" · ":""}${esc(l.email||"")}${l.obs?" · "+esc(l.obs):""}</span></div>
    <div class="row-meta"><span class="tag">${esc(l.cidade||"—")}</span>${l.nicho?`<span class="tag">${esc(l.nicho)}</span>`:""}${tagSite(l.site)}</div>
    <div class="row-side"><select class="status" onchange="chStatus('leads',${i},this.value)">${optList(STATUS_LEADS,l.status)}</select><button class="btn-edit" onclick="edit('leads',${i})">✏️</button><button class="btn-danger" onclick="del('leads',${i})">🗑️</button></div></div>`;
  }).filter(Boolean);
  const lPag=paginar(lsRows);
  $("tabelaLeads").innerHTML=(lPag.fatia.length?`${lPag.fatia.join("")}`:`<div class="empty"><span class="ico">📭</span>Nenhum lead — toque em <b>+ Adicionar</b> para cadastrar o primeiro.</div>`)+lPag.ctrl;

  const cmsRows=data.campanhas.map((x,i)=>{
    const hay=norm([x.nome,x.nicho,(x.cidades||[]).join(" "),x.status,x.obs].join(" "));
    if(!hay.includes(q))return "";
    if(fs&&x.status!==fs)return "";
    return `<div class="row">
    <div class="row-main"><span class="b">${esc(x.nome)}</span><span class="sub">${esc(x.nicho||"")}${x.obs?" · "+esc(x.obs):""}</span></div>
    <div class="row-meta">${(x.cidades||[]).map(c=>`<span class="tag">${esc(c)}</span>`).join("")||""}</div>
    <div class="row-side"><select class="status" onchange="chStatus('campanhas',${i},this.value)">${optList(STATUS_CAMP,x.status)}</select><button class="btn-edit" onclick="edit('campanhas',${i})">✏️</button><button class="btn-danger" onclick="del('campanhas',${i})">🗑️</button></div></div>`;
  }).filter(Boolean);
  const cPag=paginar(cmsRows);
  $("tabelaCampanhas").innerHTML=(cPag.fatia.length?`${cPag.fatia.join("")}`:`<div class="empty"><span class="ico">📣</span>Nenhuma campanha ainda.</div>`)+cPag.ctrl;

  const csRows=data.cidades.map((c,i)=>{
    const hay=norm(c.cidade+" "+c.uf+" "+c.bairros.join(" "));
    if(!hay.includes(q))return "";
    if(fs&&c.status!==fs)return "";
    if(fCid&&norm(c.cidade)!==norm(fCid))return "";
    if(fUf&&norm(c.uf)!==norm(fUf))return "";
    return `<div class="row">
    <div class="row-main"><span class="b">${esc(c.cidade)}</span><span class="sub">${esc(c.uf||"")}</span></div>
    <div class="row-meta">${c.bairros.slice(0,4).map(b=>`<span class="tag">${esc(b)}</span>`).join("")}${c.bairros.length>4?`<span class="tag">+${c.bairros.length-4}</span>`:""}</div>
    <div class="row-side"><select class="status" onchange="chStatus('cidades',${i},this.value)">${optList(STATUS_CIDADE,c.status)}</select><button class="btn-edit" onclick="edit('cidades',${i})">✏️</button><button class="btn-danger" onclick="del('cidades',${i})">🗑️</button></div></div>`;
  }).filter(Boolean);
  const cidPag=paginar(csRows);
  $("tabelaCidades").innerHTML=(cidPag.fatia.length?`${cidPag.fatia.join("")}`:`<div class="empty"><span class="ico">🗺️</span>Nenhuma cidade encontrada.</div>`)+cidPag.ctrl;

  const nsRows=data.nichos.map((n,i)=>{
    const hay=norm(n.nome+" "+(n.obs||""));
    if(!hay.includes(q))return "";
    return `<div class="row">
    <div class="row-main"><span class="b">${esc(n.nome)}</span><span class="sub">${esc(n.obs||"")}</span></div>
    <div class="row-side"><button class="btn-edit" onclick="edit('nichos',${i})">✏️</button><button class="btn-danger" onclick="del('nichos',${i})">🗑️</button></div></div>`;
  }).filter(Boolean);
  const nPag=paginar(nsRows);
  $("tabelaNichos").innerHTML=(nPag.fatia.length?`${nPag.fatia.join("")}`:`<div class="empty"><span class="ico">🏷️</span>Nenhum nicho encontrado.</div>`)+nPag.ctrl;
}
window.chStatus=(tab,i,v)=>{data[tab][i].status=v;save();stats();toast("Status atualizado")};
const PANES={leads:"dlgLead",campanhas:"dlgCampanha",cidades:"dlgCidade",nichos:"dlgNicho"};
window.edit=(tab,i)=>{editIdx={tab,i};const o=data[tab][i];abrir(tab,"Editar",o)};
window.del=(tab,i)=>{
  const nome=data[tab][i].nome||data[tab][i].cidade||"";
  if(confirm(`Excluir "${nome}"?`)){data[tab].splice(i,1);save();render();toast("Excluído")}
};
function abrir(kind,title,o){
  $("dlgTitle").textContent=title+" "+({leads:"lead",campanhas:"campanha",cidades:"cidade",nichos:"nicho"}[kind]);
  Object.entries(PANES).forEach(([k,id])=>$(id).style.display=k===kind?"block":"none");
  const set=(id,v)=>{const el=$(id);if(el)el.value=v||""};
  if(kind==="leads"){set("flNome",o.nome);set("flTel",o.telefone);set("flEmail",o.email);set("flCidade",o.cidade);set("flNicho",o.nicho);set("flSite",o.site||"sem site");set("flStatus",o.status||"novo");set("flObs",o.obs)}
  if(kind==="campanhas"){
    set("fcNome",o.nome);set("fcStatus",o.status||"planejada");set("fcObs",o.obs);
    // nicho: select com nichos cadastrados
    $("fcNicho").innerHTML=`<option value="">—</option>`+data.nichos.map(n=>`<option value="${esc(n.nome)}" ${o.nicho===n.nome?"selected":""}>${esc(n.nome)}</option>`).join("")+(o.nicho&&!data.nichos.some(n=>n.nome===o.nicho)?`<option value="${esc(o.nicho)}" selected>${esc(o.nicho)}</option>`:"");
    // estado: filtro
    const alvo=o.cidades||[];
    const ufSalvo=alvo.length?ufDe(alvo[0]):"";
    $("fcUfFiltro").innerHTML=`<option value="">Todos os estados</option>`+[...new Set(data.cidades.map(c=>c.uf).filter(Boolean))].sort().map(u=>`<option ${ufSalvo===u?"selected":""}>${esc(u)}</option>`).join("");
    atualizarCidCampanha(alvo);
  }
  if(kind==="cidades"){set("fCidade",o.cidade);set("fUf",o.uf);set("fBairros",(o.bairros||[]).join(", "));set("fStatus",o.status||"nao iniciada")}
  if(kind==="nichos"){set("fNome",o.nome);set("fObs",o.obs)}
  $("dlg").dataset.kind=kind;
  $("dlg").showModal();
}
$("btnAdd").onclick=()=>{editIdx=null;abrir(tab,"Adicionar",{})};
$("btnCancel").onclick=()=>$("dlg").close();
$("btnSave").onclick=()=>{
  const kind=$("dlg").dataset.kind;
  let obj;
  if(kind==="leads"){
    const nome=$("flNome").value.trim();if(!nome)return toast("Informe o nome");
    obj={nome,telefone:$("flTel").value.trim(),email:$("flEmail").value.trim(),cidade:$("flCidade").value.trim(),nicho:$("flNicho").value.trim(),site:$("flSite").value,status:$("flStatus").value,obs:$("flObs").value.trim()};
  }else if(kind==="campanhas"){
    const nome=$("fcNome").value.trim();if(!nome)return toast("Informe o nome da campanha");
    obj={nome,nicho:$("fcNicho").value,cidades:[...$("fcCidades").selectedOptions].map(op=>op.value),status:$("fcStatus").value,obs:$("fcObs").value.trim()};
  }else if(kind==="cidades"){
    const nome=$("fCidade").value.trim();if(!nome)return toast("Informe a cidade");
    obj={cidade:nome,uf:$("fUf").value.trim().toUpperCase(),bairros:$("fBairros").value.split(",").map(s=>s.trim()).filter(Boolean),status:$("fStatus").value};
  }else{
    const nome=$("fNome").value.trim();if(!nome)return toast("Informe o nicho");
    obj={nome,obs:$("fObs").value.trim()};
  }
  if(editIdx&&editIdx.tab===kind){data[kind][editIdx.i]=obj}else{data[kind].push(obj)}
  save();$("dlg").close();render();toast("Salvo ✓");
};
$("busca").oninput=()=>{pagina[tab]=1;render()};
$("filtroStatus").onchange=()=>{pagina[tab]=1;render()};
$("filtroCidade").onchange=()=>{pagina[tab]=1;render()};
$("filtroUf").onchange=()=>{pagina[tab]=1;render()};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");tab=t.dataset.tab;
  ["tabelaDashboard","tabelaLeads","tabelaCampanhas","tabelaCidades","tabelaNichos"].forEach(id=>$(id).style.display="none");
  $("tabela"+tab.charAt(0).toUpperCase()+tab.slice(1)).style.display="block";
  $("btnAdd").style.display=tab==="dashboard"?"none":"";
  $("busca").style.display=tab==="dashboard"?"none":"";
  $("filtroStatus").style.display=tab==="dashboard"?"none":"";
  pagina[tab]=1;
  render();
});
$("btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="gerenciador_leads.json";a.click();
};
$("btnImport").onclick=()=>$("fileImport").click();
$("fileImport").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    ["cidades","nichos","leads","campanhas"].forEach(k=>{if(Array.isArray(j[k]))data[k]=j[k]});
    save();render();toast("Importado ✓")
  }catch{toast("JSON inválido")}};
  r.readAsText(f);
};
render();
</script>
</body>
</html>
